<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pure3D Voyager Story</title>
		<style>
			html,
			body,
			voyager-story {
				width: 100%;
				height: 100%;
				margin: 0;
			}

			body {
				background: #303030;
				overflow: hidden;
			}
		</style>
	</head>
	<body>
		<script>
			const params = new URLSearchParams(window.location.search);
			const version = params.get('version') || '0.59.0';
			const versionRoot = params.get('resourceRoot') || `./${version}/`;

			const fontLink = document.createElement('link');
			fontLink.rel = 'stylesheet';
			fontLink.href = `${versionRoot}fonts/fonts.css`;
			document.head.appendChild(fontLink);

			const cssLink = document.createElement('link');
			cssLink.rel = 'stylesheet';
			cssLink.href = `${versionRoot}css/voyager-story.min.css`;
			document.head.appendChild(cssLink);

			const story = document.createElement('voyager-story');
			const attrMap = {
				root: params.get('root'),
				document: params.get('document'),
				model: params.get('model'),
				geometry: params.get('geometry'),
				resourceRoot: params.get('resourceRoot') || versionRoot,
				mode: params.get('mode'),
				uiMode: params.get('uiMode'),
				uiLang: params.get('uiLang')
			};

			for (const [key, value] of Object.entries(attrMap)) {
				if (value) story.setAttribute(key, value);
			}

			if (params.has('expert')) story.setAttribute('expert', '');
			if (params.has('dragdrop')) story.setAttribute('dragdrop', '');

			document.body.appendChild(story);

			const script = document.createElement('script');
			script.src = `${versionRoot}js/voyager-story.min.js`;
			script.defer = true;
			document.head.appendChild(script);
		</script>
	</body>
</html>
