services:
  pocketbase:
    environment:
      PUBLIC_POCKETBASE_URL: https://127.0.0.1:${FRONTEND_PORT:-60020}
      ORCID_ISSUER: https://orcid.org

  pocketbase-setup:
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      PUBLIC_POCKETBASE_URL: https://127.0.0.1:${FRONTEND_PORT:-60020}
      PUBLIC_ASSET_BASE_URL: https://127.0.0.1:${FRONTEND_PORT:-60020}/assets
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-pure3d}
      R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-pure3d-local-secret}
      R2_REGION: us-east-1
      ORCID_ISSUER: https://orcid.org
      ORCID_ENVIRONMENT: production
      # Explicit empties prevent Bun from loading production credentials from mounted .env.
      ORCID_CLIENT_ID: ''
      ORCID_CLIENT_SECRET: ''
    command: sh -c "bun install && bun scripts/create-pocketbase-collections.ts && bun scripts/migrate-documentation.ts && bun scripts/import-data.ts --onboarding-dir /app/data/import-onboarding && bun scripts/seed-local-demo-users.ts"

  frontend:
    environment:
      PUBLIC_DEMO_LOGIN: '1'
      PUBLIC_POCKETBASE_URL: https://127.0.0.1:${FRONTEND_PORT:-60020}
      PUBLIC_ASSET_BASE_URL: https://127.0.0.1:${FRONTEND_PORT:-60020}/assets
      DEV_HTTPS: '1'
      DEV_POCKETBASE_TARGET: http://pocketbase:8090
      DEV_ASSET_TARGET: http://minio:9000
      DEV_ASSET_BUCKET: ${R2_BUCKET:-pure3d-assets}
      ORCID_CLIENT_ID: ''
      ORCID_CLIENT_SECRET: ''
