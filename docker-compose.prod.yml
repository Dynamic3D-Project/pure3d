# Production override: builds static frontend with nginx
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-}
        PUBLIC_POCKETBASE_URL: ${PUBLIC_POCKETBASE_URL:-http://localhost:7090}
        PUBLIC_ASSET_BASE_URL: ${PUBLIC_ASSET_BASE_URL:-}
    image: pure3d-frontend
    volumes:
      - ./static/project:/usr/share/nginx/html/project:ro
      - ./static/voyager:/usr/share/nginx/html/voyager:ro
    command: []
