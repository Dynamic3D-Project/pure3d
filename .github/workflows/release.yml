name: Release and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_BASE_PATH: /pure3d
  PUBLIC_POCKETBASE_URL: https://main.57-129-98-223.sslip.io
  PUBLIC_ASSET_BASE_URL: https://main.57-129-98-223.sslip.io/assets

concurrency:
  group: release-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const title = process.env.PR_TITLE ?? ""; if (!/^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?(!)?: .+/.test(title)) { console.error(`PR title is not a Conventional Commit: ${title}`); process.exit(1); }'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.10.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify ORCID backend cutover
        run: curl --fail --silent --show-error --max-time 30 https://main.57-129-98-223.sslip.io/api/pure3d/orcid/ready

      - name: Release
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover interrupted release or build non-release commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test -f build/version.json; then exit 0; fi
          mapfile -t release_tags < <(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' || true)
          if (( ${#release_tags[@]} > 1 )); then
            echo "Multiple release tags point at HEAD; refusing to choose one." >&2
            exit 1
          fi
          if (( ${#release_tags[@]} == 1 )); then
            tag="${release_tags[0]}"
            archive="pure3d-${tag}.tar.gz"
            if gh release view "$tag" >/dev/null 2>&1; then
              mkdir -p recovery
              if gh release download "$tag" --pattern "$archive" --dir recovery; then
                rm -rf build
                mkdir build
                tar -xzf "recovery/$archive" -C build
              else
                node scripts/release-build.mjs "$tag" "$archive"
                gh release upload "$tag" "$archive#Production site artifact" --clobber
              fi
            else
              node scripts/release-build.mjs "$tag" "$archive"
              gh release create "$tag" "$archive#Production site artifact" --verify-tag --generate-notes --title "$tag"
            fi
          else
            node scripts/release-build.mjs "dev+${GITHUB_SHA::12}"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
