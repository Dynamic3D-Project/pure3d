name: Checks and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_BASE_PATH: ''
  PUBLIC_POCKETBASE_URL: https://api.pure3d.eu
  PUBLIC_ASSET_BASE_URL: https://api.pure3d.eu/assets

concurrency:
  group: ${{ github.event_name == 'push' && 'release-main' || format('checks-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Conventional Commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const title = process.env.PR_TITLE ?? ""; if (!/^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?(!)?: .+/.test(title)) { console.error(`PR title is not a Conventional Commit: ${title}`); process.exit(1); }'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: |
          bunx --no-install paraglide-js compile --project ./locale/project.inlang --outdir ./src/lib/paraglide
          bun run check

      - name: Feature integration tests
        run: bun --no-env-file test src scripts pocketbase

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_commit: ${{ steps.release.outputs.release_commit }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Generate localisation modules
        run: bunx --no-install paraglide-js compile --project ./locale/project.inlang --outdir ./src/lib/paraglide

      - name: Build and publish semantic release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          released=false
          for attempt in 1 2 3; do
            if bun --no-env-file scripts/release.ts --patch; then
              released=true
              break
            fi
            [[ "$attempt" == 3 ]] || sleep 20
          done
          "$released"
          tag="v$(node -p "require('./package.json').version")"
          test "$(git tag --points-at HEAD --list "$tag")" = "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      release_commit: ${{ needs.release.outputs.release_commit }}
